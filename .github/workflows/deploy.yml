name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const url = process.env.VITE_SUPABASE_URL
            const key = process.env.VITE_SUPABASE_ANON_KEY
            let validUrl = false
            try {
              validUrl = new URL(url).protocol === "https:"
            } catch {}
            const supportedKey = key?.startsWith("sb_publishable_") || key?.split(".").length === 3
            if (!validUrl || !supportedKey || /placeholder|replace-me|your-project-ref/i.test(url + key) || /service_role|sb_secret_/i.test(key)) {
              console.error("Set VITE_SUPABASE_URL and the Supabase anon/publishable key as Actions secrets. Do not use a service-role or secret key.")
              process.exit(1)
            }
          '

      - name: Build site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLASSROOM_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLASSROOM_CLIENT_ID }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
